# Configuracao executavel com os dados disponiveis neste checkout.
# scientific_valid=false impede confundir este smoke test com a baseline TACO-10 final.
dataset_yaml: data/mini_test/data.yaml
dataset_label: coco8-mini-smoke-test
scientific_valid: false
model: yolov8n.pt
num_clients: 3
rounds: 3
local_epochs: 1
mu: 0.0
batch_size: 2
# Com 2 iteracoes/round, o acumulo padrao (nbs=64) nunca daria um passo do
# otimizador; nbs=2 garante que o smoke test realmente treina e agrega.
nbs: 2
image_size: 128
device: cpu
base_seed: 20260914
partition_seed: 42
output_dir: results/baseline
