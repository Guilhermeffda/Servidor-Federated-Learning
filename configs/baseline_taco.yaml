# Baseline cientifica: requer taco_data/scripts/prepare_experiments.py concluido.
dataset_yaml: data/centralized/data.yaml
dataset_label: TACO-10
scientific_valid: true
partition_root: data/partitions
evaluation_yaml: taco_data/data/test_global/data.yaml
model: yolov8n.pt
num_clients: 5
rounds: 50
local_epochs: 5
mu: 0.0
batch_size: 16
image_size: 640
device: "0"
base_seed: 20260914
partition_seed: 42
output_dir: results/baseline_taco
# Augmentations nativas do Ultralytics, fixadas explicitamente (card P2/S2 de
# classes escassas pos-Dirichlet). Sao os valores padrao do Ultralytics —
# registrados aqui para que a estrategia fique documentada e reproduzivel.
# Objetos de lixo em foto de rua sao pequenos: manter mosaic/scale padrao e nao
# usar flipud (lixo raramente aparece de cabeca para baixo).
# Relatorio de combinacoes criticas: taco_data/scripts/augmentation_report.py.
augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
